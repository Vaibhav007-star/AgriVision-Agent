name: agrivision_mobile
description: "AgriVision Mobile - Offline AI Crop Disease Diagnostic & Advisory App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/crop_disease_model.tflite
    - assets/labels.txt
    - assets/disease_database.json
    - assets/haryana_offline_blocks.json
